name: Build

# Runs on every push, and can be started by hand from the Actions tab
# (Actions → Build → "Run workflow").
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub's runners ship the Android SDK, but not necessarily the exact
      # platform this project compiles against. Installing it explicitly is
      # cheap; the `|| true` keeps a changed tools layout from failing the job,
      # since the Gradle plugin can still fetch what it needs.
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Unit tests (core)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee test.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      # Surfaces Kotlin/AGP errors on the run's summary page, so a failure can be
      # read without opening and scrolling the raw log.
      - name: Summarise compile errors
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo
            if grep -qE "^e: " build.log 2>/dev/null; then
              echo "### Kotlin compile errors"
              echo '```'
              grep -E "^e: " build.log | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | head -100
              echo '```'
            fi
            if grep -qiE "FAILURE:|What went wrong" build.log 2>/dev/null; then
              echo "### Gradle failure"
              echo '```'
              sed -n '/^FAILURE:/,/^\* Try:/p' build.log | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deep-universe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Uploaded even on failure: this is the file to download and share when
      # something needs fixing.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: warn
